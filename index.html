<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫번째 아이디어</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, #0f2b5c 0%, #071329 55%, #020713 100%);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 은은한 배경 블루 글로우 및 빛무리 효과 */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.28) 0%, rgba(59, 130, 246, 0.12) 40%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite alternate;
    }

    .ambient-glow-secondary {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      top: 25%;
      left: 55%;
      animation: float 8s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 3.5rem;
      border-radius: 28px;
      background: rgba(15, 30, 60, 0.45);
      border: 1px solid rgba(59, 130, 246, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px -15px rgba(2, 6, 23, 0.8),
                  0 0 45px -5px rgba(37, 99, 235, 0.25),
                  inset 0 1px 1px rgba(147, 197, 253, 0.2);
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 50%, #1d4ed8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.5));
      transition: all 0.4s ease;
      cursor: default;
      user-select: none;
    }

    h1:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 0 50px rgba(96, 165, 250, 0.8));
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(-30px, 30px);
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="ambient-glow-secondary"></div>
  
  <main class="container">
    <h1>내 첫번째 아이디어</h1>
  </main>
</body>
</html>
